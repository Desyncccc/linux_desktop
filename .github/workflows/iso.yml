name: Live ISO

# Builds a bootable live ISO (Debian 13 base) that starts straight into Vitrum.
on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: Build package for Debian 13
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake ninja-build g++ pkg-config file dpkg-dev libpam0g-dev libwayland-dev libwayland-bin \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-declarative-private-dev \
            qt6-wayland-dev qt6-wayland-private-dev qt6-shadertools-dev qt6-svg-dev \
            qml6-module-qtwayland-compositor qml6-module-qt5compat-graphicaleffects
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DVITRUM_BUILD_TESTS=OFF
          cmake --build build
          cd build && cpack -G DEB
      - uses: actions/upload-artifact@v4
        with:
          name: vitrum-deb-debian-13
          path: build/*.deb

  iso:
    name: Build live ISO
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vitrum-deb-debian-13
          path: iso/packages
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build ISO (live-build in a privileged Debian container)
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src debian:trixie bash iso/build-iso.sh
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: vitrum-live-iso
          path: out/*.iso
          compression-level: 0
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.iso
