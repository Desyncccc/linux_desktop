name: Live ISO

# Builds a bootable live ISO (Debian 13 base) that starts straight into Vitrum.
on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: Build package for Debian 13
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake ninja-build g++ pkg-config file dpkg-dev libpam0g-dev libwayland-dev libwayland-bin \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-declarative-private-dev \
            qt6-wayland-dev qt6-wayland-private-dev qt6-shadertools-dev qt6-svg-dev \
            qml6-module-qtwayland-compositor qml6-module-qt5compat-graphicaleffects
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DVITRUM_BUILD_TESTS=OFF \
            -DVITRUM_DEB_EXTRA_DEPENDS="qt6-svg-plugins, qml6-module-qtwayland-compositor, qt6-qpa-plugins"
          cmake --build build
          cd build && cpack -G DEB
      - name: Smoke test the Debian 13 build (scripted UI tour, fails on any QML warning)
        run: |
          apt-get install -y --no-install-recommends ./build/vitrum_*.deb xvfb xauth libgl1-mesa-dri fonts-noto-core
          export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$XDG_RUNTIME_DIR"
          mkdir -p screenshots
          Xvfb :99 -screen 0 1366x768x24 &
          sleep 2
          DISPLAY=:99 QT_QPA_PLATFORM=xcb VITRUM_NO_DBUS=1 VITRUM_NO_AUTOSTART=1 \
            timeout 180 vitrum --demo "$PWD/screenshots" --strict
          test "$(ls screenshots/*.png | wc -l)" -ge 15
      - uses: actions/upload-artifact@v4
        with:
          name: vitrum-deb-debian-13
          path: build/*.deb

  iso:
    name: Build live ISO
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vitrum-deb-debian-13
          path: iso/packages
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build ISO (live-build in a privileged Debian container)
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src debian:trixie bash iso/build-iso.sh
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: vitrum-live-iso
          path: out/*.iso
          compression-level: 0
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.iso

  boot-test:
    name: Boot ISO in QEMU (${{ matrix.vga }} graphics)
    needs: iso
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        vga: [std, virtio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vitrum-live-iso
          path: iso-out
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils socat libarchive-tools imagemagick
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true
      - name: Boot and capture
        run: bash iso/boot-test.sh iso-out/*.iso ${{ matrix.vga }} boot-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test-${{ matrix.vga }}
          path: boot-shots
