# Vitrum installer (Calamares). Installs the live system onto a disk.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: vitrum-prepare
  module: shellprocess
  config: shellprocess_vitrum-prepare.conf
- id: vitrum-bootloader
  module: shellprocess
  config: shellprocess_vitrum-bootloader.conf
- id: vitrum-finish
  module: shellprocess
  config: shellprocess_vitrum-finish.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@vitrum-prepare
  - users
  - networkcfg
  - hwclock
  - shellprocess@vitrum-bootloader
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - shellprocess@vitrum-finish
  - umount
- show:
  - finished

branding: vitrum
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
