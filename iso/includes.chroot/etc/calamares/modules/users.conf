---
userGroup: users
defaultGroups:
    - cdrom
    - sudo
    - audio
    - dip
    - video
    - render
    - input
    - plugdev
    - netdev
autologinGroup: autologin
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
doAutologin: false
user:
    shell: /bin/bash
    forbidden_names: [ root, user ]
hostname:
    location: EtcFile
    template: "VITRUM-PC"
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
